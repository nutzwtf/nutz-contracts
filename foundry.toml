[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"          # exact pin; bump deliberately
evm_version = "prague"           # confirmed live on chain 4663 (ArbOS 61): TSTORE, MCOPY, CLZ, EIP-2537
optimizer = true
optimizer_runs = 10_000          # claim/push paths run many times; favour runtime gas
via_ir = false
deny = "warnings"
ffi = false                      # never enable in this repo; see ADR-0001
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./script/config" }]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true            # handlers must bound inputs; a revert is a handler bug

[profile.ci]                     # FOUNDRY_PROFILE=ci in GitHub Actions
[profile.ci.fuzz]
runs = 10_000
[profile.ci.invariant]
runs = 1_000
depth = 200

[profile.corpus]                 # FOUNDRY_PROFILE=corpus: coverage-guided fuzzing, on demand (docs/setup/tools.md)
# Setting corpus_dir turns the mode on and keeps the inputs and call sequences that reached new code under corpus/
# (gitignored, survives `forge clean`). Not in the default profile: measured with forge 1.8.3, the three invariant
# suites take ~30 s each instead of a few seconds and the unit suite's fuzz tests did not finish in 5 minutes.
[profile.corpus.fuzz]
corpus_dir = "corpus/fuzz"
[profile.corpus.invariant]
corpus_dir = "corpus/invariant"

[profile.default.symbolic]        # forge test --symbolic; the test/symbolic/ suites (docs/setup/tools.md)
# The per-period cap check walks five tokens through three outcomes each and needs ~3,700 paths; the default 1,024
# stops it as "incomplete"; a two-entry push with Merkle proofs and two payouts runs past the default 10,000 opcodes.
# The timeout is the solver budget per test in seconds: the fee checks are 256-bit division proofs that Z3 takes
# minutes over.
max_paths = 8192
max_depth = 40000
timeout = 3000

[profile.default.coverage]
exclude_tests = true
skip_files = ["script/**", "src/vendor/**"]

[lint]
severity = ["high", "med", "low", "info", "gas"]
ignore = ["test/**/*.sol"]   # test code is not deployed; src/ and script/ are linted on every build
# reentrancy-events fires on every emit that follows an "external call"; since forge 1.8.3 that includes calls made
# inside library code, i.e. the ecrecover precompile in OpenZeppelin ECDSA.recover (`_require2of3`) and the EIP-2537
# precompiles in the Draw's verify path. Precompiles cannot call back: all ten hits are false positives.
exclude_lints = ["reentrancy-events"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${RPC_4663}"                 # Chainstack archive, from .env
robinhood_public = "${RPC_4663_PUBLIC}"   # rate-limited, 2,000-block eth_getLogs cap
robinhood_testnet = "${RPC_46630}"        # chain 46630; no Pons / Stock Tokens there
